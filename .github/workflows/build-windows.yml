name: Windows build and validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test tests/windows.integration.cjs
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Maximo-FPS-Windows-x64
          path: release/Maximo-FPS-Setup-*.exe
          if-no-files-found: error
